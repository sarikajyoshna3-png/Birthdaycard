<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Wishes</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #16002e, #081b3d, #3b0b4f);
  color: white;
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 380px;
  min-height: 560px;
  padding: 35px 25px;
  text-align: center;
  border-radius: 25px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,215,120,0.5);
  box-shadow: 0 0 40px rgba(255,215,120,.3);
  animation: open 1.5s ease;
}

@keyframes open {
  from {
    transform: scale(.5);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

h1 {
  margin-top: 30px;
  color: #ffd76a;
  font-size: 38px;
  text-shadow: 0 0 15px #ffd76a;
}

.name {
  color: #ffb6df;
  font-size: 28px;
  margin: 20px 0;
}

p {
  font-size: 17px;
  line-height: 1.7;
}

.cake {
  font-size: 85px;
  margin: 20px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 5px gold); }
  to { filter: drop-shadow(0 0 25px gold); }
}

.sparkles {
  font-size: 25px;
  letter-spacing: 12px;
}

.balloon {
  font-size: 35px;
  margin: 10px;
}
</style>
</head>

<body>

<div class="card">

  <div class="sparkles">✦ ✧ ✦</div>

  <div class="balloon">🎈 🎈 🎈</div>

  <h1>HAPPY<br>BIRTHDAY</h1>

  <div class="name">[NAME] 💖</div>

  <div class="cake">🎂</div>

  <p>
    Wishing you a beautiful day filled with
    happiness, love, laughter and wonderful memories! ✨
  </p>

  <div class="sparkles">✨ ✦ ✨</div>

</div>

</body>
</html>
